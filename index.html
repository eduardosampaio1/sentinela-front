<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- O tradutor do navegador NÃO pode mexer nesta árvore.

         Medido em homologação: o Chrome ofereceu traduzir inglês→português, o usuário aceitou, e
         a tela morreu com `Failed to execute 'insertBefore' on 'Node'`. O tradutor substitui os
         nós de texto por conta própria; o React, na renderização seguinte, procura o nó que
         deixou de existir e quebra. É defeito conhecido da combinação, e não tem conserto do
         lado do React.

         O produto tem i18n PRÓPRIO (PT/EN, com o `lang` acompanhando a escolha em
         `LanguageContext`), então a tradução automática é redundante — e hoje ela é pior que
         redundante: derruba a página. Bloquear é a escolha honesta enquanto for assim.

         O custo está registrado: quem não fala nenhum dos dois idiomas perde a máquina de
         tradução. A saída para essa pessoa é um idioma novo no produto, não um tradutor que
         quebra a tela. -->
    <meta name="google" content="notranslate" />
    
    <title>Sentinela</title>
    <meta name="description" content="Plataforma de monitoramento e diagnóstico de saúde de IAs." />
    <meta name="author" content="Baluarte" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <meta property="og:title" content="Sentinela" />
    <meta property="og:description" content="Diagnóstico avançado para assistentes virtuais e fluxos de IA." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sentinela.baluarte.io" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sentinela" />
    <meta name="twitter:description" content="Diagnóstico avançado para assistentes virtuais." />
    <meta name="twitter:image" content="/og-image.png" />

    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>
    <div id="root"></div>
    
    <noscript>JavaScript is required to run Sentinela.</noscript>
  </body>
</html>
